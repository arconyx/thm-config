name: Test

on:
    push:
    pull_request:

permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6.1.0

            - name: Install nix
              uses: cachix/install-nix-action@v31.10.6

            - name: Check
              run: nix flake check --all-systems --show-trace
